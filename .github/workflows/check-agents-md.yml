name: checks

# AGENTS.md is built from rules/*.md and must never be hand-edited: agents
# without `@` import support read it as their only source of the rules.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: AGENTS.md matches rules/
        run: scripts/build-agents.sh --check
      - name: generator behaves
        run: scripts/test-build-agents.sh
      - name: installer behaves
        run: scripts/test-install-skill.sh
      - name: rules installer behaves
        run: scripts/test-install-rules.sh
      - name: installation contracts hold
        run: scripts/test-install-contracts.sh
      - name: scaffold behaves
        run: scripts/test-new-skill.sh
      - name: rule-set scaffolds behave
        run: scripts/test-new-rule-set.sh
      - name: conventions check behaves
        run: scripts/test-check-conventions.sh
      - name: conventions hold
        run: scripts/check-conventions.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell installer behaves
        shell: pwsh
        run: scripts/test-install-skill.ps1
